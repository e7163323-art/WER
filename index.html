<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שליפת מפתחות Gemini</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;line-height:1.6}
  input{width:100%;padding:8px;box-sizing:border-box;direction:ltr}
  button{padding:10px 18px;margin:8px 0;font-size:16px;cursor:pointer}
  pre{background:#f3f3f3;padding:12px;border-radius:6px;direction:ltr;white-space:pre-wrap;max-height:300px;overflow:auto}
  #dl{display:none}
</style>
</head>
<body>
<h1>שליפת מפתחות Gemini</h1>
<label>OAuth Client ID (מ-Google Cloud Console):</label>
<input id="cid" value="302681980822-g6urqmoau0agfn19gse0kpfgceoq7osp.apps.googleusercontent.com" placeholder="xxxx.apps.googleusercontent.com">
<label style="display:block;margin-top:8px"><input type="checkbox" id="create" checked style="width:auto"> צור מפתח חדש בפרויקטים שאין בהם</label>
<button id="login">התחבר עם Google ושלוף 10 מפתחות</button>
<button id="dl">הורד קובץ מפתחות</button>
<pre id="log">ממתין…</pre>

<script>
const MAX = 10;
const SCOPE = 'https://www.googleapis.com/auth/cloud-platform';
const $ = id => document.getElementById(id);
const log = t => { $('log').textContent += '\n' + t; };
let token = null, keys = [];


$('login').onclick = () => {
  const cid = $('cid').value.trim();
  if (!cid) return alert('הכנס Client ID');
  try { localStorage.setItem('cid', cid); } catch(e){}
  google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: SCOPE,
    callback: r => {
      if (r.error) return log('שגיאת התחברות: ' + r.error);
      token = r.access_token;
      run().catch(e => log('שגיאה: ' + e.message));
    }
  }).requestAccessToken();
};

async function api(url, body) {
  const opt = { headers: { Authorization: 'Bearer ' + token } };
  if (body !== undefined) {
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
  return r.json();
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function createKey(projectId) {
  // הפעלת Gemini API בפרויקט (אם כבר מופעל, לא קורה כלום)
  try {
    await api(`https://serviceusage.googleapis.com/v1/projects/${projectId}/services/generativelanguage.googleapis.com:enable`, {});
  } catch (e) { log(`  (הפעלת Gemini API: ${e.message.slice(0, 80)})`); }
  let op = await api(`https://apikeys.googleapis.com/v2/projects/${projectId}/locations/global/keys`, {
    displayName: 'Gemini key',
    restrictions: { apiTargets: [{ service: 'generativelanguage.googleapis.com' }] }
  });
  for (let i = 0; i < 20 && !op.done; i++) {
    await sleep(1500);
    op = await api('https://apikeys.googleapis.com/v2/' + op.name);
  }
  if (!op.done) throw new Error('יצירת המפתח לא הסתיימה בזמן');
  if (op.error) throw new Error(op.error.message);
  return op.response.keyString;
}

async function listProjects() {
  const seen = new Map();
  // חיפוש גרסה 3
  try {
    let pageToken = '';
    do {
      const d = await api('https://cloudresourcemanager.googleapis.com/v3/projects:search?query=state:ACTIVE' +
        (pageToken ? '&pageToken=' + pageToken : ''));
      (d.projects || []).forEach(p => seen.set(p.projectId, p));
      pageToken = d.nextPageToken;
    } while (pageToken);
  } catch (e) { log('(חיפוש v3: ' + e.message.slice(0, 100) + ')'); }
  // רשימה גרסה 1
  try {
    let pageToken = '';
    do {
      const d = await api('https://cloudresourcemanager.googleapis.com/v1/projects?filter=lifecycleState:ACTIVE' +
        (pageToken ? '&pageToken=' + pageToken : ''));
      (d.projects || []).forEach(p => seen.set(p.projectId, p));
      pageToken = d.nextPageToken;
    } while (pageToken);
  } catch (e) { log('(רשימה v1: ' + e.message.slice(0, 100) + ')'); }
  return [...seen.values()];
}

function isGemini(k) {
  const t = k.restrictions && k.restrictions.apiTargets;
  return !t || t.some(x => x.service === 'generativelanguage.googleapis.com');
}

async function run() {
  $('log').textContent = 'שולף פרויקטים…';
  keys = [];
  const projects = await listProjects();
  log('נמצאו ' + projects.length + ' פרויקטים');
  if (!projects.length) log('לא נמצאו פרויקטים בחשבון הזה. צריך ליצור פרויקט ב-console.cloud.google.com או ב-aistudio.google.com ולנסות שוב.');
  for (const p of projects) {
    if (keys.length >= MAX) break;
    try {
      const d = await api(`https://apikeys.googleapis.com/v2/projects/${p.projectId}/locations/global/keys`);
      const k = (d.keys || []).find(isGemini);
      let keyString;
      if (k) {
        keyString = (await api(`https://apikeys.googleapis.com/v2/${k.name}/keyString`)).keyString;
        log(`✔ ${p.projectId}: ${keyString.slice(0, 8)}… (קיים)`);
      } else if ($('create').checked) {
        keyString = await createKey(p.projectId);
        log(`✔ ${p.projectId}: ${keyString.slice(0, 8)}… (נוצר חדש)`);
      } else { log(`- ${p.projectId}: אין מפתח מתאים`); continue; }
      keys.push({ project: p.projectId, key: keyString });
    } catch (e) {
      log(`- ${p.projectId}: ${e.message.slice(0, 120)}`);
    }
  }
  log(`\nסה"כ ${keys.length} מפתחות`);
  if (keys.length) $('dl').style.display = 'inline-block';
}

$('dl').onclick = () => {
  const txt = keys.map(k => `${k.project}\t${k.key}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = 'gemini-keys.txt';
  a.click();
};
</script>
</body>
</html>
